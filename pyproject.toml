[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signoff-protocol"
version = "0.1.0a1"
description = "A spec-locked, evidence-driven reliability control plane for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Signoff contributors"}]
keywords = ["coding-agents", "ai-agents", "software-engineering", "verification", "review"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
signoff = "signoff.cli:main"


[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
signoff = ["assets/skills/**/*", "web_dist/**/*"]
